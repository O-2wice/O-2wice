<text x="18" y="60" fill="#c0caf5" font-size="15">Debugging is twice as hard as writing the</text>
<text x="18" y="84" fill="#c0caf5" font-size="15">code in the first place.</text>
<text x="18" y="120" fill="#7f88a8" font-size="12.5">— Brian Kernighan</text>
</g>
