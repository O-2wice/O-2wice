<text x="18" y="72" fill="#c0caf5" font-size="15">Make it work, make it right, make it fast.</text>
<text x="18" y="108" fill="#7f88a8" font-size="12.5">— Kent Beck</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.87500;0.88393;0.99107;1.00000;1" dur="56.00s" repeatCount="indefinite"/>
<text x="18" y="60" fill="#c0caf5" font-size="15">Measure what is measurable, and make</text>
<text x="18" y="84" fill="#c0caf5" font-size="15">measurable what is not so.</text>
