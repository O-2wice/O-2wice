<svg xmlns="http://www.w3.org/2000/svg" width="760" height="122" viewBox="0 0 760 122" role="img" aria-label="All models are wrong, but some are useful.">
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70a5fd"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
</defs>
<rect width="760" height="122" rx="12" fill="#1a1b27"/>
<rect width="760" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
<text x="30" y="56" fill="#70a5fd" font-family="Georgia,serif" font-size="52" opacity="0.5">“</text>
<g font-family="'Segoe UI',Ubuntu,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00000;0.00714;0.09286;0.10000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">All models are wrong, but some are useful.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— George Box</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10000;0.10714;0.19286;0.20000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">In God we trust. All others must bring data.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— W. Edwards Deming</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20000;0.20714;0.29286;0.30000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">The goal is to turn data into information, and information into insight.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— Carly Fiorina</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30000;0.30714;0.39286;0.40000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">Simplicity is prerequisite for reliability.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— Edsger W. Dijkstra</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40000;0.40714;0.49286;0.50000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">It is a capital mistake to theorise before one has data.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— Arthur Conan Doyle</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50000;0.50714;0.59286;0.60000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">Torture the data, and it will confess to anything.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— Ronald Coase</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60000;0.60714;0.69286;0.70000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">Premature optimization is the root of all evil.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— Donald Knuth</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70000;0.70714;0.79286;0.80000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="48" fill="#c0caf5" font-size="15">An approximate answer to the right problem is worth a good deal more than an exact answer to</text>
<text x="66" y="72" fill="#c0caf5" font-size="15">an approximate problem.</text>
<text x="66" y="108" fill="#7f88a8" font-size="12.5">— John Tukey</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.80000;0.80714;0.89286;0.90000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">Programs must be written for people to read.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— Harold Abelson</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.90000;0.90714;0.99286;1.00000;1" dur="70.00s" repeatCount="indefinite"/>
<text x="66" y="60" fill="#c0caf5" font-size="15">Data is a precious thing and will last longer than the systems themselves.</text>
<text x="66" y="96" fill="#7f88a8" font-size="12.5">— Tim Berners-Lee</text>
</g>
</g></svg>