<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="170" role="img" aria-label="The goal is to turn data into information, and information into insight.">
<style>.n{display:none}@media(max-width:560px){.w{display:none}.n{display:inline}}@media(prefers-color-scheme:light){[fill="#1a1b27"]{fill:#f6f8fa}[stroke="#1a1b27"]{stroke:#f6f8fa}[stop-color="#1a1b27"]{stop-color:#f6f8fa}[fill="#c0caf5"]{fill:#1f2328}[stroke="#c0caf5"]{stroke:#1f2328}[stop-color="#c0caf5"]{stop-color:#1f2328}[fill="#7f88a8"]{fill:#59636e}[stroke="#7f88a8"]{stroke:#59636e}[stop-color="#7f88a8"]{stop-color:#59636e}[fill="#565f89"]{fill:#6e7781}[stroke="#565f89"]{stroke:#6e7781}[stop-color="#565f89"]{stop-color:#6e7781}[fill="#70a5fd"]{fill:#0969da}[stroke="#70a5fd"]{stroke:#0969da}[stop-color="#70a5fd"]{stop-color:#0969da}[fill="#bb9af7"]{fill:#8250df}[stroke="#bb9af7"]{stroke:#8250df}[stop-color="#bb9af7"]{stop-color:#8250df}[fill="#ffffff"]{fill:#1f2328}[stroke="#ffffff"]{stroke:#1f2328}[stop-color="#ffffff"]{stop-color:#1f2328}}</style>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70a5fd"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
</defs>
<rect width="100%" height="170" rx="12" fill="#1a1b27"/>
<rect width="100%" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
<text class="w" x="30" y="80" fill="#70a5fd" font-family="Georgia,serif" font-size="52" opacity="0.5">“</text>
<g font-family="'Segoe UI',Ubuntu,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
<g class="w">
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00000;0.00893;0.11607;0.12500;1" dur="56.00s" repeatCount="indefinite"/>
<text x="66" y="84" fill="#c0caf5" font-size="15">The goal is to turn data into information, and information into insight.</text>
<text x="66" y="120" fill="#7f88a8" font-size="12.5">— Carly Fiorina</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12500;0.13393;0.24107;0.25000;1" dur="56.00s" repeatCount="indefinite"/>
<text x="66" y="84" fill="#c0caf5" font-size="15">The purpose of computing is insight, not numbers.</text>
<text x="66" y="120" fill="#7f88a8" font-size="12.5">— Richard Hamming</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25000;0.25893;0.36607;0.37500;1" dur="56.00s" repeatCount="indefinite"/>
<text x="66" y="84" fill="#c0caf5" font-size="15">Statistics are the grammar of science.</text>
<text x="66" y="120" fill="#7f88a8" font-size="12.5">— Karl Pearson</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.37500;0.38393;0.49107;0.50000;1" dur="56.00s" repeatCount="indefinite"/>
<text x="66" y="84" fill="#c0caf5" font-size="15">Simplicity is prerequisite for reliability.</text>
<text x="66" y="120" fill="#7f88a8" font-size="12.5">— Edsger W. Dijkstra</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50000;0.50893;0.61607;0.62500;1" dur="56.00s" repeatCount="indefinite"/>
<text x="66" y="84" fill="#c0caf5" font-size="15">It is a capital mistake to theorise before one has data.</text>
<text x="66" y="120" fill="#7f88a8" font-size="12.5">— Arthur Conan Doyle</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62500;0.63393;0.74107;0.75000;1" dur="56.00s" repeatCount="indefinite"/>
<text x="66" y="84" fill="#c0caf5" font-size="15">Torture the data, and it will confess to anything.</text>
<text x="66" y="120" fill="#7f88a8" font-size="12.5">— Ronald Coase</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75000;0.75893;0.86607;0.87500;1" dur="56.00s" repeatCount="indefinite"/>
<text x="66" y="84" fill="#c0caf5" font-size="15">Premature optimization is the root of all evil.</text>
<text x="66" y="120" fill="#7f88a8" font-size="12.5">— Donald Knuth</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.87500;0.88393;0.99107;1.00000;1" dur="56.00s" repeatCount="indefinite"/>
<text x="66" y="72" fill="#c0caf5" font-size="15">An approximate answer to the right problem is worth a good deal more</text>
<text x="66" y="96" fill="#c0caf5" font-size="15">than an exact answer to an approximate problem.</text>
<text x="66" y="132" fill="#7f88a8" font-size="12.5">— John Tukey</text>
</g>
</g>
<g class="n">
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00000;0.00893;0.11607;0.12500;1" dur="56.00s" repeatCount="indefinite"/>
<text x="18" y="72" fill="#c0caf5" font-size="15">The goal is to turn data into information,</text>
<text x="18" y="96" fill="#c0caf5" font-size="15">and information into insight.</text>
<text x="18" y="132" fill="#7f88a8" font-size="12.5">— Carly Fiorina</text>
</g>
