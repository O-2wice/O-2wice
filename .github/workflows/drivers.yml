name: Daily Drivers

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/drivers.yml'
      - 'scripts/build_drivers_panel.py'
      - 'scripts/svg_common.py'

permissions:
  contents: write

jobs:
  drivers:
    name: Refresh daily drivers table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render driver rows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: O-2wice
        run: python3 scripts/build_drivers_panel.py

      - name: Commit
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@o-2wice.noreply.invalid"
          git add README.md metrics/drivers
          if git diff --staged --quiet; then
            echo "Driver rows unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh daily drivers"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; another job may have pushed first. Retrying."
            sleep 5
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
