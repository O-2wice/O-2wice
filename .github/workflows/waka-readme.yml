name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          # Read-only PAT: needed for cross-repo stats (private repo count,
          # language-per-repo). It deliberately has no write access.
          GH_TOKEN: ${{ secrets.O_2WICE_PAT_KEY }}
          # The push uses Actions' own token, scoped to this repo only.
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keeps the commit off github-actions[bot]'s contributor entry.
          COMMIT_USERNAME: "profile-bot"
          COMMIT_EMAIL: "profile-bot@o-2wice.noreply.invalid"
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE: "True"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_AI_CODING: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_LOC_CHART: "False"
