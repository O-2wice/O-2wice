name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          # Needs Contents: Read and write - the action pushes the README
          # itself, using this token in the clone URL.
          GH_TOKEN: ${{ secrets.O_2WICE_PAT_KEY }}
          # Keeps the commit off github-actions[bot]'s contributor entry.
          COMMIT_USERNAME: "profile-bot"
          COMMIT_EMAIL: "profile-bot@o-2wice.noreply.invalid"
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          # The editor split was 99% AI tooling (Codex 52/17%, Claude Code 28%),
          # which is what a hiring reader would take from it. Weekly language
          # time says the same thing about effort without that framing.
          SHOW_EDITORS: "False"
          SHOW_LANGUAGE: "True"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_AI_CODING: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_LOC_CHART: "False"
          # The short-info block repeated the stats panel and disagreed with
          # it: it counts forks, so it claimed 31 public repos against the
          # panel's 16, and its storage figure renders as "?".
          SHOW_SHORT_INFO: "False"
          # Repos-per-language is the languages panel again, by another name.
          SHOW_LANGUAGE_PER_REPO: "False"
          # Weekly time by language and editor is the one thing only WakaTime
          # knows, so that stays.
          SHOW_TOTAL_CODE_TIME: "True"
