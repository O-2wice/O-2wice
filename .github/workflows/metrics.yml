name: Metrics

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [preview]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

jobs:
  metrics:
    name: Generate metrics panels
    runs-on: ubuntu-latest
    steps:
      - name: Music panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: O-2wice
          filename: metrics/music.svg
          base: ""
          config_timezone: Europe/Budapest
          extras_css: |
            svg { background: #1a1b27; border-radius: 10px; }
            .title, h2 { color: #70a5fd !important; }
            .field, .value, span, div, tspan { color: #a9b1d6; }
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          plugin_music_playlist: https://music.youtube.com/playlist?list=PLWJzcQJwrVbM
          plugin_music_limit: 4
