name: Metrics

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [preview]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

jobs:
  metrics:
    name: Generate metrics panels
    runs-on: ubuntu-latest
    steps:
      - name: Panels
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: O-2wice
          filename: metrics/panels.svg
          base: ""
          config_display: columns
          config_timezone: Europe/Budapest
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          plugin_music_playlist: https://music.youtube.com/playlist?list=PLWJzcQJwrVbM
          plugin_music_limit: 4
