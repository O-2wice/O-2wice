name: Token diagnostic
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.O_2WICE_PAT_KEY }}
        run: |
          echo "length=${#T}  prefix=${T:0:4}"
          case "$T" in *[[:space:]]*) echo "WARNING: token contains whitespace";; *) echo "no whitespace";; esac
          echo -n "api /user       -> "; curl -s -o /tmp/u -w "%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/user
          echo -n "login           -> "; python3 -c "import json;print(json.load(open('/tmp/u')).get('login','?'))" 2>/dev/null || echo "?"
          echo -n "scopes          -> "; curl -sI -H "Authorization: Bearer $T" https://api.github.com/user | grep -i '^x-oauth-scopes:' || echo "(none reported)"
          echo -n "repo perms      -> "; curl -s -H "Authorization: Bearer $T" https://api.github.com/repos/O-2wice/O-2wice | python3 -c "import sys,json;print(json.load(sys.stdin).get('permissions'))"
          echo "--- push test ---"
          git clone -q "https://$T@github.com/O-2wice/O-2wice.git" t 2>&1 | tail -2
          cd t && git ls-remote --heads origin >/dev/null 2>&1 && echo "read ok"
          git push --dry-run origin main 2>&1 | tail -3
