name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'metrics/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: O-2wice
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          # Keep the bot off the contributors list
          committer: profile-bot <profile-bot@o-2wice.noreply.invalid>
          author: profile-bot <profile-bot@o-2wice.noreply.invalid>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
